services:
  - type: web
    name: zayd-cafe-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: WEBAPP_URL
        value: https://zayd-cafe.vercel.app
      - key: FRONTEND_URL
        value: https://zayd-cafe.vercel.app
